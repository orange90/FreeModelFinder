name: Update Free Models List

on:
  # 每天 UTC 00:00 与 12:00 自动运行（每 12 小时一次）
  schedule:
    - cron: '0 0,12 * * *'
  # 允许手动触发
  workflow_dispatch:
  # 当数据源或渲染脚本变更时，自动重建 README
  push:
    branches:
      - main
    paths:
      - 'free-models.json'
      - 'scripts/update-readme.mjs'
      - '.github/workflows/update-free-models.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update generatedAt in free-models.json
        run: |
          today=$(date -u +%Y-%m-%d)
          node -e "
            const fs = require('fs');
            const p = 'free-models.json';
            const data = JSON.parse(fs.readFileSync(p, 'utf8'));
            data.generatedAt = '${today}';
            fs.writeFileSync(p, JSON.stringify(data, null, 2) + '\n');
          "

      - name: Render README table
        run: node scripts/update-readme.mjs

      - name: Commit & push if changed
        run: |
          if [[ -z "$(git status --porcelain README.md free-models.json)" ]]; then
            echo "No changes; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md free-models.json
          git commit -m "chore(readme): auto-update free models table"
          git push
