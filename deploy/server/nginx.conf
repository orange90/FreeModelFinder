limit_req_zone $binary_remote_addr zone=fmf_rate:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=fmf_conn:10m;

server {
    listen PUBLIC_IP:80;
    server_name PUBLIC_IP;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}

server {
    listen PUBLIC_IP:443 ssl;
    http2 on;
    server_name PUBLIC_IP;

    ssl_certificate /etc/letsencrypt/live/PUBLIC_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PUBLIC_IP/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;
    limit_req zone=fmf_rate burst=10 nodelay;
    limit_conn fmf_conn 20;

    location = /v1/models {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/freemodelfinder-proxy.conf;
    }

    location = /v1/chat/completions {
        limit_except POST { deny all; }
        include /etc/nginx/snippets/freemodelfinder-proxy.conf;
    }

    location = /v1/messages {
        limit_except POST { deny all; }
        include /etc/nginx/snippets/freemodelfinder-proxy.conf;
    }

    location ~ ^/v1beta/models/.+:(generateContent|streamGenerateContent)$ {
        limit_except POST { deny all; }
        include /etc/nginx/snippets/freemodelfinder-proxy.conf;
    }

    location / {
        return 404;
    }
}
